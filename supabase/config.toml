# Auth pattern (audit H-33): every function below has an EXPLICIT verify_jwt
# entry — no function may rely on the deploy default.
#
# verify_jwt = false is DELIBERATE for all but request-payout. Supabase's
# gateway JWT check would reject the cron/internal-token callers and the
# service-role calls used between functions, so authentication is done
# IN CODE instead: every function calls authenticateRequest() from
# supabase/functions/_shared/security.ts, which validates the caller's
# Bearer token with Auth, loads their profiles.is_banned flag, and then
# each function enforces its own role check (admin / brand / owner) before
# doing anything. If you add a function, add its entry here AND an
# authenticateRequest call as its first step — a missing entry or a
# missing in-code check is an unauthenticated function.
#
# request-payout keeps verify_jwt = true as defence in depth on top of
# the same in-code check.

[functions.calculate-earnings]
verify_jwt = false

[functions.fetch-tiktok-views]
verify_jwt = false

[functions.fetch-instagram-views]
verify_jwt = false

[functions.fetch-youtube-views]
verify_jwt = false

[functions.update-all-views]
verify_jwt = false

[functions.verify-instagram-bio]
verify_jwt = false

[functions.verify-tiktok-bio]
verify_jwt = false

[functions.process-submission]
